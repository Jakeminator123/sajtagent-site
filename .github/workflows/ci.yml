name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check builder contracts
        run: npm run check:contracts

      - name: Check Agent Studio profile contract
        run: npm run check:agent-profile

      - name: Check fail-closed build-job boundary
        run: npm run check:build-jobs

      - name: Check card flow model and generated documentation
        run: npm run cards:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
