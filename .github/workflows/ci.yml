name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic contracts and product checks
        run: npm run check

      - name: Check V1 surface and transcription boundary
        run: npm run check:v1-cleanup

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      - name: Start local Supabase
        run: supabase db start

      - name: Reapply every migration from scratch
        run: supabase db reset --local

      - name: Run pgTAP access and invariant tests
        run: supabase test db

      - name: Lint the local database
        run: supabase db lint --local --fail-on error
